# ---------------------------------------------------------------- model
model:
  # Channel width of the first level; every level is width * 2**i.
  width: 16
  depth: 5

# ---------------------------------------------------------------- loss / schedule
loss:
  kind: dice_ce             # dice_ce | dice_focal | region_dice_bce
  class_weights: null       # null = uniform; otherwise [background, ET, NETC, CC, ED]

schedule:
  kind: cosine              # cosine | none
  min_lr: 1.0e-5

# ---------------------------------------------------------------- 3D augmentation
augmentation:
  flip_prob: 0.5
  rotate_prob: 0.3
  rotate_range_deg: 10.0
  zoom_prob: 0.3
  zoom_min: 0.9
  zoom_max: 1.1
  scale_intensity_factor: 0.1
  scale_intensity_prob: 0.3
  shift_intensity_offset: 0.1
  shift_intensity_prob: 0.3
  gaussian_noise_prob: 0.2
  gaussian_noise_std: 0.05
  modality_dropout_prob: 0.0
  sequence_shift_prob: 0.0
  sequence_shift_max_voxels: 1.2