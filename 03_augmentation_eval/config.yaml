# 03_augmentation_eval — configuration
# All augmentation is gated by the single flag `use_augmentation` (see CONTRACTS.md).

# ---------------------------------------------------------------- ablation flags
use_augmentation: true      # master switch: MONAI stack AND mixup
use_mixup: true             # sub-flag, only has effect when use_augmentation is true
use_federation: false       # recorded in the results CSV; implemented in 01_model_federated
use_domain_adaptation: false  # recorded in the results CSV; implemented in 02_domain_adaptation

# ---------------------------------------------------------------- paths
paths:
  cache: "D:/Medical AI Workshop/cache_96cube"
  manifests: "../00_shared/manifests"
  strata_csv: "strata.csv"
  plans_dir: "plans"
  results_csv: "results/ablation_results.csv"

# ---------------------------------------------------------------- data
data:
  modalities: ["t1c", "t1n", "t2f", "t2w"]
  spatial_size: [96, 96, 96]
  num_classes: 5            # background + labels 1..4
  valid_labels: [0, 1, 2, 3, 4]

# ---------------------------------------------------------------- expansion
expansion:
  target_per_hospital: 150
  seed: 1337

# ---------------------------------------------------------------- tumor-type proxy
# NOTE: no tumor-type ground truth exists in the manifests or the cache. These
# thresholds define an IMAGING PROXY derived from the segmentation mask geometry.
# It is NOT histology. Override with `--tumor-type-csv` when real labels exist.
strata:
  lr_axis: 0                # array axis running left-right (midline-ness)
  is_axis: 2                # array axis running inferior-superior (brainstem is low)
  midline_offset_max: 0.15  # |centroid_lr - center| / center, below this = midline
  inferior_frac_min: 0.60   # fraction of tumor voxels below the axial midpoint
  et_frac_max: 0.10         # enhancing fraction; DMG/DIPG often enhances little
  dmg_label: "dmg_like"
  other_label: "astrocytoma_like"

# ---------------------------------------------------------------- MONAI augmentation
augmentation:
  flip_prob: 0.5            # applied per spatial axis
  affine_prob: 0.3
  rotate_range_deg: 10.0    # +/- degrees about each axis
  zoom_prob: 0.3
  zoom_min: 0.9
  zoom_max: 1.1
  scale_intensity_prob: 0.3
  scale_intensity_factor: 0.1
  shift_intensity_prob: 0.3
  shift_intensity_offset: 0.1
  gaussian_noise_prob: 0.2
  gaussian_noise_std: 0.05

# ---------------------------------------------------------------- mixup
mixup:
  alpha: 0.4                # Beta(alpha, alpha); must be > 0
